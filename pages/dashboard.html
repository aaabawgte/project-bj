<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PROJECT BJ</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="container">

        <header class="flex-between">
            <div>
                <h1>PROJECT BJ</h1>
                <p class="text-muted">Odaberite alat</p>
            </div>

            <button id="logout-btn" class="btn btn-secondary">
                Odjava
            </button>
        </header>

        <main class="dashboard-main">

            <div class="dashboard-grid">

                <a href="calculator.html" class="tool-link">
                    <div class="card tool-card">
                        <div class="tool-icon">🛡️</div>
                        <h2>Jamstva</h2>
                        <p class="text-muted">Kalkulator</p>
                    </div>
                </a>

                <a href="notes.html" class="tool-link">
                    <div class="card tool-card">
                        <div class="tool-icon">📝</div>
                        <h2>Notes</h2>
                        <p class="text-muted">Bilješke</p>
                    </div>
                </a>

                <a href="warranties.html" class="tool-link">
                    <div class="card tool-card">
                        <div class="tool-icon">📋</div>
                        <h2>Prodana jamstva</h2>
                        <p class="text-muted">Evidencija</p>
                    </div>
                </a>

                <a href="warranty-stats.html" class="tool-link">
                    <div class="card tool-card">
                        <div class="tool-icon">📊</div>
                        <h2>Statistika jamstava</h2>
                        <p class="text-muted">Pregled</p>
                    </div>
                </a>

            </div>

        </main>

    </div>

    <script src="../js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PROJECT BJ</title>

    <link rel="stylesheet" href="../css/style.css">
    <style>
        @media (max-width: 700px) {
            .dashboard-layout {
                display: grid;
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .dashboard-content,
            .dashboard-main,
            .dashboard-grid,
            .dashboard-sidebar {
                width: 100%;
                min-width: 0;
            }

            .dashboard-main {
                margin-top: 24px;
            }

            .dashboard-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .tool-link {
                width: 100%;
                display: block;
            }

            .tool-card {
                width: 100%;
                height: auto;
                min-height: 118px;
                padding: 18px;
            }

            .dashboard-admin-row {
                justify-content: stretch;
            }

            .dashboard-admin-row .btn,
            #theme-toggle {
                width: 100%;
            }

            .dashboard-sidebar {
                position: static;
                display: grid;
                gap: 12px;
            }

            .dashboard-user-area {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .dashboard-user-card,
            .dashboard-user-area .btn {
                width: 100%;
                height: 48px;
                min-height: 48px;
            }

            .announcements-card {
                width: 100%;
                max-height: none;
                min-height: 320px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="dashboard-layout">

            <section class="dashboard-content">
                <header class="flex-between">
                    <div>
                        <h1>PROJECT BJ</h1>
                        <p class="text-muted">Odaberite alat</p>
                    </div>
                </header>

                <main class="dashboard-main">

                    <div class="dashboard-admin-row">
                        <a href="admin.html" id="admin-tile" class="btn btn-secondary">
                            ⚙️ Admin
                        </a>
                    </div>

                    <div class="dashboard-grid">

                        <a href="calculator.html" class="tool-link">
                            <div class="card tool-card">
                                <div class="tool-icon">🛡️</div>
                                <h2>Jamstva</h2>
                                <p class="text-muted">Kalkulator</p>
                            </div>
                        </a>

                        <a href="notes.html" class="tool-link">
                            <div class="card tool-card">
                                <div class="tool-icon">📝</div>
                                <h2>Notes</h2>
                                <p class="text-muted">Bilješke</p>
                            </div>
                        </a>

                        <a href="warranties.html" class="tool-link">
                            <div class="card tool-card">
                                <div class="tool-icon">📋</div>
                                <h2>Prodana jamstva</h2>
                                <p class="text-muted">Evidencija</p>
                            </div>
                        </a>

                        <a href="warranty-stats.html" class="tool-link">
                            <div class="card tool-card">
                                <div class="tool-icon">📊</div>
                                <h2>Statistika jamstava</h2>
                                <p class="text-muted">Pregled</p>
                            </div>
                        </a>

                        <a href="offers.html" class="tool-link">
                            <div class="card tool-card">
                                <div class="tool-icon">🏷️</div>
                                <h2>Trenutne ponude</h2>
                                <p class="text-muted">Akcije</p>
                            </div>
                        </a>

                    </div>

                </main>
            </section>

            <aside class="dashboard-sidebar">
                <button id="theme-toggle" class="btn btn-secondary" title="Tamni način">
                    🌙
                </button>
                <div class="dashboard-user-area">
                    <a href="profile.html" class="dashboard-user-card dashboard-user-link">
                        <div class="dashboard-user-label">Prijavljen korisnik</div>
                        <div id="current-user" class="dashboard-user-name">
                            Učitavanje...
                        </div>
                    </a>

                    <button id="logout-btn" class="btn btn-secondary">
                        Odjava
                    </button>
                </div>

                <section class="card announcements-card">
                    <div class="announcements-header">
                        <div>
                            <h2>Obavijesti</h2>
                            <p class="text-muted">Zadnje objave</p>
                        </div>
                    </div>

                    <div id="announcements-list" class="announcements-list">
                        <p class="text-muted">Učitavanje obavijesti...</p>
                    </div>

                    <form id="announcement-form" class="announcement-form" hidden>
                        <label for="announcement-content">Nova obavijest</label>
                        <textarea id="announcement-content" placeholder="Upiši obavijest..."></textarea>

                        <button type="submit" class="btn btn-primary">
                            Objavi
                        </button>
                    </form>
                </section>
            </aside>

        </div>

    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>

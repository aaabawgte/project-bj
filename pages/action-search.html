<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretraga akcija</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="container">

        <header class="page-header">
            <div>
                <h1>🔍 Pretraga akcija</h1>
                <p class="text-muted">Pretraži aktualne akcijske artikle po nazivu.</p>
            </div>

            <div class="page-actions">
                <a href="dashboard.html" class="btn btn-secondary">
                    Natrag
                </a>
            </div>
        </header>

        <div class="card products-card action-search-card">
            <label for="search-input">Pretraži artikl</label>

            <input
                type="text"
                id="search-input"
                placeholder="Upiši naziv artikla..."
            >
        </div>

        <div id="search-results" class="results-grid action-results-list">
            <!-- Rezultati će se prikazivati ovdje -->
        </div>

    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/action-search.js"></script>
</body>
</html>



<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novi zahtjev | PROJECT BJ</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="container">

        <header class="page-header">
            <div>
                <h1>➕ Novi zahtjev</h1>
                <p class="text-muted">Pošalji želju za budući raspored rada.</p>
            </div>

            <div class="page-actions">
                <button id="theme-toggle" type="button" class="btn btn-secondary">
                    🌙
                </button>

                <a href="shifts.html" class="btn btn-secondary">
                    Natrag
                </a>
            </div>
        </header>

        <section class="card form-card">
            <form id="shift-request-form">

                <div class="form-group">
                    <label for="request-date">Datum</label>
                    <input type="date" id="request-date" required>
                    <small id="weekday-preview" class="text-muted"></small>
                </div>

                <div class="form-group">
                    <label for="shift-type">Željena smjena</label>
                    <select id="shift-type" required>
                        <option value="">Odaberi smjenu</option>
                        <option value="jutro">Ujutro</option>
                        <option value="popodne">Popodne</option>
                        <option value="slobodno">Slobodno</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reason">Razlog (opcionalno)</label>
                    <textarea
                        id="reason"
                        rows="4"
                        placeholder="Npr. privatne obveze, liječnik, zamjena smjene..."
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Pošalji zahtjev
                </button>
            </form>
        </section>

    </div>

   <script src="../js/theme.js"></script>
<script src="../js/api.js"></script>
<script src="../js/shift-request.js"></script>
</body>
</html>
